name: Publicar imagem Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Validar CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  codeql:
    name: Análise de segurança
    needs: ci
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: [ci, codeql]
    permissions:
      contents: read
      packages: write
    name: Construir e publicar imagem
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar metadados da imagem
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/marcelositr/devnux-mesh-brasil
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=https://github.com/marcelositr/devnux-mesh-brasil
            org.opencontainers.image.description=Broker MQTT comunitário para integração de redes Meshtastic no Brasil
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
