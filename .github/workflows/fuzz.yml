name: Fuzz

on:
  push:
    branches:
      - "work/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-fuzz:
    name: Fuzz do parser ServiceEnvelope
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Executar fuzzing direcionado
        run: go test ./internal/broker -fuzz=FuzzParseServiceEnvelope -fuzztime=30s -parallel=2
