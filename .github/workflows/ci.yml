name: CI

on:
  workflow_call:
  push:
    branches:
      - main
      - "dev/**"
      - "refactor/**"
      - "work/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Testes e qualidade
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verificar formatação
        shell: bash
        run: |
          files=$(git ls-files "*.go" | xargs -r gofmt -l)
          if [ -n "$files" ]; then
            echo "Os arquivos abaixo não estão formatados com gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Testes
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Testes com detector de condições de corrida
        run: go test -race ./...

      - name: Fuzz direcionado do parser ServiceEnvelope
        run: go test ./internal/broker -fuzz=FuzzParseServiceEnvelope -fuzztime=5s -parallel=2

      - name: Verificar vulnerabilidades alcançáveis nas dependências Go
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build
        run: go build ./cmd/broker

      - name: Testar exclusões de segredos do contexto Docker
        run: bash scripts/test-dockerignore.sh

      - name: Construir imagem Docker sem publicar
        run: docker build -t devnux-mesh-brasil:test .

      - name: Verificar vulnerabilidades da imagem Docker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devnux-mesh-brasil:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Testar inicialização da imagem Docker com TLS
        shell: bash
        run: |
          set -euo pipefail
          cert_dir="$RUNNER_TEMP/devnux-certs"
          mkdir -p "$cert_dir"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$cert_dir/private.key" \
            -out "$cert_dir/certificate.pem" \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1" \
            -days 1
          # O arquivo da chave só pode ser lido por seu proprietário e grupo.
          # O GID do grupo primário do usuário do container é usado no host para o bind mount.
          container_gid="$(docker run --rm --entrypoint sh devnux-mesh-brasil:test -c 'id -g devnux')"
          sudo chgrp "$container_gid" "$cert_dir/private.key"
          chmod 755 "$cert_dir"
          chmod 640 "$cert_dir/private.key"
          chmod 644 "$cert_dir/certificate.pem"
          test "$(stat -c '%a' "$cert_dir/private.key")" = "640"

          docker run -d \
            --name devnux-mesh-broker-smoke \
            -p 127.0.0.1:18883:8883 \
            -v "$cert_dir:/etc/devnux/certs:ro" \
            devnux-mesh-brasil:test

          trap 'docker rm -f devnux-mesh-broker-smoke >/dev/null 2>&1 || true' EXIT

          tls_log="$RUNNER_TEMP/devnux-tls-smoke.log"
          for _ in $(seq 1 20); do
            timeout 3 openssl s_client \
              -connect 127.0.0.1:18883 \
              -CAfile "$cert_dir/certificate.pem" \
              -verify_return_error -brief </dev/null >"$tls_log" 2>&1 || true
            if grep -q "Verification: OK" "$tls_log" && grep -q "Protocol version: TLSv1" "$tls_log"; then
              cat "$tls_log"
              exit 0
            fi
            sleep 1
          done

          docker logs devnux-mesh-broker-smoke || true
          cat "$tls_log"
          exit 1
 -fuzz=FuzzParseServiceEnvelope -fuzztime=5s -parallel=2

      - name: Verificar vulnerabilidades alcançáveis nas dependências Go
