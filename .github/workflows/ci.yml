name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
      - "refactor/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Testes e qualidade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Diagnosticar formatação
        shell: bash
        run: |
          set -x
          go version
          echo "Arquivos Go versionados:"
          git ls-files "*.go"
          echo "Resultado do gofmt:"
          git ls-files "*.go" | xargs -r gofmt -l
          status=${PIPESTATUS[1]}
          echo "Código de saída do gofmt: $status"
          exit "$status"

      - name: Testes
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./cmd/broker
